<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MindMetric | Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding-bottom: 20px;
        }
        
        /* Mobile-first Navbar */
        .navbar {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .container {
            width: 100%;
            padding: 0 15px;
            margin: 0 auto;
        }
        
        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .brand {
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: #333;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
        }
        
        .nav-links a.active {
            color: #007bff;
            font-weight: bold;
        }
        
        #navbarUsername {
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Mobile Cards - Stack vertically */
        .cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 100%;
        }
        
        .card h4 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }
        
        .card h5 {
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .card hr {
            margin: 15px 0;
            border: none;
            border-top: 1px solid #eee;
        }
        
        /* Form elements - Touch friendly */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: 500;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .btn-block {
            width: 100%;
        }
        
        .badge {
            background: #007bff;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            display: inline-block;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-3 {
            margin-top: 15px;
        }
        
        .mb-2 {
            margin-bottom: 10px;
        }
        
        .profile-info {
            margin-bottom: 12px;
            font-size: 15px;
        }
        
        .profile-info strong {
            display: inline-block;
            width: 60px;
            font-size: 14px;
        }
        
        /* Sign out link */
        .signout-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            display: inline-block;
        }
        
        /* Small screen adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }
            
            .card {
                padding: 16px;
            }
            
            .nav-links {
                gap: 10px;
            }
            
            .brand {
                font-size: 16px;
            }
            
            .nav-links a, #navbarUsername {
                font-size: 12px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 14px;
            }
            
            input {
                padding: 10px;
                font-size: 14px;
            }
            
            .badge {
                font-size: 14px;
                padding: 4px 12px;
            }
        }
        
        /* Tablet adjustments */
        @media (min-width: 768px) and (max-width: 1024px) {
            .cards-wrapper {
                flex-direction: row;
                gap: 25px;
            }
            
            .container {
                max-width: 90%;
            }
        }
        
        /* Desktop */
        @media (min-width: 1025px) {
            .container {
                max-width: 1000px;
            }
            
            .cards-wrapper {
                flex-direction: row;
                gap: 30px;
            }
            
            button {
                width: auto;
            }
            
            .btn-block {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-flex">
        <a class="brand" href="{{ url_for('index') }}">MindMetric</a>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('profile') }}" class="active">Profile</a>
            <span id="navbarUsername">Jeremiah</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="cards-wrapper">
        <!-- Left Card - Profile -->
        <div class="card">
            <h4>Profile</h4>
            <div class="profile-info">
                <strong>Name:</strong> <span id="displayNameText">Jeremiah</span>
            </div>
            <div class="profile-info">
                <strong>ID:</strong> <span id="profileStudentId">Jeremiah</span>@mmu.edu
            </div>
            
            <hr>
            
            <h5>Edit Name</h5>
            <input type="text" id="editNameInput" value="Jeremiah">
            <button id="saveNameBtn">Save</button>
            
            <hr>
            
            <h5>Total Moods</h5>
            <p><span class="badge" id="totalMoodsCount">—</span> entries</p>
        </div>
        
        <!-- Right Card - Change Password -->
        <div class="card">
            <h4>Change Password</h4>
            <input type="password" id="newPassword" placeholder="New Password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <button class="btn-block" id="updatePasswordBtn">Update Password</button>
        </div>
    </div>
    
    <div class="text-center mt-3">
        <a href="{{ url_for('login') }}" class="signout-link">Sign out</a>
    </div>
</div>
