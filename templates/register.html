{% extends "base.html" %}
{% block content %}
<main class="page-container center-layout">
    <div class="content-panel auth-panel">
        <header class="panel-header">
            <h1 class="panel-title">Register</h1>
            <p class="panel-subtitle">Start tracking your mental data trends</p>
        </header>

        <form action="{{ url_for('register') }}" method="POST" class="semantic-form">
            <div class="form-group">
                <label class="section-label">Username</label>
                <input type="text" name="username" class="input-field" required>
            </div>
            <div class="form-group">
                <label class="section-label">Password</label>
                <input type="password" name="password" class="input-field" required>
            </div>
            <button type="submit" class="action-btn block-btn">Create Account</button>
        </form>

        <footer class="panel-footer">
            <p class="panel-link-text">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </footer>
    </div>
</main>
{% endblock %}
