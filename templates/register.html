{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <header class="auth-header">
            <h2>Sign Up</h2>
            <p class="auth-subtitle">Create your own account</p>
        </header>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="password" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <div class="form-group">
                <h2>Password Recovery Questions</h2>

                <div class="form-group">
                    <label class="form-label">1. What was the name of your first pet?</label>
                    <input type="text" name="q1" class="form-control form-control-sm" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">2. What is your mother's maiden name?</label>
                    <input type="text" name="q2" class="form-control form-control-sm" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">3. What was the name of your primary school?</label>
                    <input type="text" name="q3" class="form-control form-control-sm" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mb-3">Create Account</button>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="text-decoration-none small text-muted">← Back to Home</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
