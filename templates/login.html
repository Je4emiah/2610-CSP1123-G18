{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <header class="auth-header">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to track your MindMetric insights</p>
        </header>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="password" required>
            </div>

            <!-- Remember Me -->
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember_me">
                    <span class="checkbox-label">Remember me for 7 days</span>
                </label>
            </div>

            <button type="submit" class="auth-trigger w-100">Sign In</button>
        </form>

        <footer class="auth-footer">
            <!-- Forgot Password -->
            <p><a href="{{ url_for('forgot_password') }}" class="secondary-link">Forgot password?</a></p>
            <!-- Register Link -->
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="secondary-link">Create one</a></p>
        </footer>
    </div>
</section>
{% endblock %}
