{% extends "base.html" %}
{% block content %}
<main class="page-container center-layout">
    <div class="content-panel auth-panel">
        <header class="panel-header">
            <h1 class="panel-title">Login</h1>
            <p class="panel-subtitle">Welcome back to MindMetric</p>
        </header>

        <form action="{{ url_for('login') }}" method="POST" class="semantic-form">
            <div class="form-group">
                <label class="section-label">Username</label>
                <input type="text" name="username" class="input-field" required>
            </div>
            <div class="form-group">
                <label class="section-label">Password</label>
                <input type="password" name="password" class="input-field" required>
            </div>
            <button type="submit" class="action-btn block-btn">Sign In</button>
        </form>

        <footer class="panel-footer">
            <p class="panel-link-text">New here? <a href="{{ url_for('register') }}">Create account</a></p>
            <a href="{{ url_for('forgot_password') }}" class="panel-link-text">Forgot password?</a>
        </footer>
    </div>
</main>
{% endblock %}
