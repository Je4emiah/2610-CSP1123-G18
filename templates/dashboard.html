{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm border-0">
                <h5 class="fw-bold mb-3">Log Your Mood</h5>
                <select class="form-select mb-3" id="moodScore">
                    <option value="5">🔥 Great</option>
                    <option value="4">😊 Good</option>
                    <option value="3" selected>😐 Neutral</option>
                    <option value="2">☹️ Bad</option>
                    <option value="1">😫 Terrible</option>
                </select>
                <textarea class="form-control mb-3" id="thoughtText" rows="3"
                    placeholder="What happened today?"></textarea>
                <button class="btn btn-primary w-100 rounded-pill" onclick="saveMood()">Save Entry</button>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4 text-center shadow-sm border-0 h-100">
                <h5 class="fw-bold mb-4">Your Emotional Trend</h5>
                <div class="btn-group mb-3" role="group">
                    <button class="btn btn-outline-primary btn-sm" onclick="loadChart('6h')">6 Hours</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadChart('day')">Day</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadChart('week')">Week</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadChart('month')">Month</button>
                </div>
                <div style="position: relative; height:300px; width:100%">
                    <canvas id="moodChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="text-center mt-4">
    <a href="{{ url_for('history') }}" class="btn btn-primary rounded-pill px-4 shadow">
        View My Full Diary History
    </a>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    // 1. Function to fetch data and draw the theme-aware chart
async function loadChart(range = 'day') {
    try {
        const response = await fetch(`/api/mood_data/{{ session['user_id'] }}?range=${range}`);
        
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        const ctx = document.getElementById('moodChart').getContext('2d');
        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--bs-body-color');

        if (window.myChart) { window.myChart.destroy(); }

        window.myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Mood Score',
                    data: data.data,
                    borderColor: '#00D4FF',
                    backgroundColor: 'rgba(0, 212, 255, 0.1)',
                    borderWidth: 3,
                    tension: 0.4, // Smoother curves
                    fill: true,
                    pointRadius: 4,
                    pointBackgroundColor: '#00D4FF'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        min: 1, 
                        max: 5, 
                        ticks: { color: textColor, stepSize: 1 },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    x: { 
                        ticks: { 
                            color: textColor,
                            maxRotation: 0, // Keep labels horizontal
                            autoSkip: true, // Automatically hide overlapping labels
                            maxTicksLimit: 6, // Show a maximum of 6 time markers
                            callback: function(val, index) {
                                // Logic: Trims "2026-05-03 01:40:46" down to just "01:40"
                                const fullLabel = this.getLabelForValue(val);
                                if (fullLabel.includes(' ')) {
                                    const timePart = fullLabel.split(' ')[1];
                                    return timePart.substring(0, 5); 
                                }
                                return fullLabel;
                            }
                        },
                        grid: { display: false } // Cleaner look without vertical lines
                    }
                },
                plugins: {
                    legend: { display: false } // Hide legend to give the chart more room
                }
            }
        });

        if(range !== 'day') showToast(`Trend updated for: ${range}`, 'info');

    } catch (error) {
        console.error('Error loading chart:', error);
        showToast("Could not load chart data.", "danger");
    }
}
// 2. The function to save a new mood
async function saveMood() {
    const scoreElement = document.getElementById('moodScore');
    const thoughtElement = document.getElementById('thoughtText');

    const score = scoreElement.value;
    const thought = thoughtElement.value;
    
    // Dynamically gets the logged-in user (e.g., 'basma1')
    const activeUser = "{{ session['user_id'] }}"; 

    try {
        const response = await fetch('/api/log_mood', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: activeUser, 
                mood_score: parseInt(score),
                thought_text: thought
            })
        });

        const result = await response.json();
        if (result.status === 'success') {
            // Clear the text area for the next entry
            thoughtElement.value = '';
            
            // Trigger your feedback toast system
            showToast("Mood logged successfully!", "success");
            
            // REFRESH the graph immediately for the current account
            loadChart('day'); 
        } else {
            showToast("Error: " + result.message, "danger");
        }
    } catch (error) {
        console.error('Save failed:', error);
        showToast("Server connection failed.", "danger");
    }
}
    document.addEventListener('DOMContentLoaded', () => loadChart('day'));
</script>
{% endblock %}
