{% extends 'base.html' %}
{% block content %}
  <main class="dashboard-story-wrapper">
    <section class="story-section" id="section-log">
      <div class="section-content max-width-md">
        <header class="dashboard-header">
          <h1 class="main-title">Your Insights</h1>
        </header>

        <div class="content-panel logger-module">
          <h2 class="section-label">Log Your Mind</h2>
          <form id="moodForm" action="{{ url_for('dashboard') }}" method="POST" class="semantic-form">
            <div class="form-group">
              <label for="moodScore" class="field-label">How are you feeling?</label>
              <select class="input-field" id="moodScore" name="mood_score">
                <option value="5">🔥 Great</option>
                <option value="4">😊 Good</option>
                <option value="3" selected>😐 Neutral</option>
                <option value="2">☹️ Bad</option>
                <option value="1">😫 Terrible</option>
              </select>
            </div>

            <div class="form-group">
              <label class="field-label">Quick Notes</label>
              <textarea name="thought" class="input-field dynamic-textarea" placeholder="What's on your mind?"></textarea>
            </div>

            <button type="submit" class="action-btn block-btn">Save Entry</button>
          </form>
        </div>
      </div>
    </section>

    <section class="story-section" id="section-insight">
      <div class="section-content max-width-md text-center">
        <div class="content-panel insight-module">
          <h3 class="section-label">💡 Weekly Insight</h3>

          <div class="ai-emoji-display" id="aiEmoji">{{ insight.emoji }}</div>

          <div class="ai-review-container">
            <p id="insightText" class="insight-text main-review">{{ insight.review }}</p>
            <p class="insight-text sub-recommendation">
              Based on <strong>{{ entry_count }} entries</strong> tracked over the last 7 days (Average: {{ avg_score }}/5).
            </p>
          </div>

          <button class="nav-item-btn" style="margin-top: 2rem;" onclick="scrollToSection('section-chart')">View Visual Analytics ↓</button>
        </div>
      </div>
    </section>
    <section class="story-section" id="section-chart">
      <div class="section-content max-width-lg">
        <div class="content-panel visualization-module">
          <header class="view-header">
            <h2 class="section-label">Mood Insights</h2>
            <div class="controls-bar">
              <button class="nav-item-btn" onclick="changeRange('day')">24h</button>
              <button class="nav-item-btn" onclick="changeRange('week')">Week</button>
              <button class="nav-item-btn" onclick="changeRange('all')">All</button>
              <span id="dataCounter" class="status-counter">Loading...</span>
            </div>
          </header>

          <div class="chart-view">
            <canvas id="moodChart" data-username="{{ session.user_id }}"></canvas>
          </div>

          <footer id="pagingControls" class="view-footer">
            <button id="prevBtn" class="nav-item-btn" onclick="movePage(1)">← Previous</button>
            <span id="rangeLabel" class="range-date-label">Current Day</span>
            <button id="nextBtn" class="nav-item-btn" onclick="movePage(-1)" disabled>Next →</button>
          </footer>
        </div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
