{% extends 'base.html' %}
{% block title %}
  Dashboard
{% endblock %}

{% block content %}
  <div class="container my-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-4 shadow-sm border-0">
          <h5 class="fw-bold mb-3">Log Your Mood</h5>
          <select class="form-select mb-3" id="moodScore">
            <option value="5">🔥 Great</option>
            <option value="4">😊 Good</option>
            <option value="3" selected>😐 Neutral</option>
            <option value="2">☹️ Bad</option>
            <option value="1">😫 Terrible</option>
          </select>
          <textarea class="form-control mb-3" id="thoughtText" rows="3" placeholder="What happened today?"></textarea>
          <button class="btn btn-primary w-100 rounded-pill" onclick="saveMood()">Save Entry</button>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-4 text-center shadow-sm border-0 h-100">
          <div class="btn-group mb-3">
            <button onclick="changeRange('day')">Day</button>
            <button onclick="changeRange('week')">Week</button>
            <button onclick="changeRange('month')">Month</button>
            <button onclick="changeRange('all')">All</button>
          </div>

          <div id="pagingControls">
            <button id="prevBtn" onclick="movePage(1)">← Previous</button>
            <span id="rangeLabel">Current Day</span>
            <button id="nextBtn" onclick="movePage(-1)" disabled>Next →</button>
          </div>

          <div class="chart-container" style="height: 300px;">
            <canvas id="moodChart" data-username="{{ session.user_id }}"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="text-center mt-4">
    <a href="{{ url_for('history') }}" class="btn btn-primary rounded-pill px-4 shadow">View My Full Diary History</a>
  </div>
{% endblock %}
