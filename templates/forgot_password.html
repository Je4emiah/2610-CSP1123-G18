{% extends 'base.html' %}
{% block content %}
  <div class="login-body d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="login-card p-4 shadow-lg bg-white rounded" style="width: 400px;">
      <h3 class="text-center mb-4">Security Verification</h3>

      {% if not user_found %}
        <form action="{{ url_for('forgot_password') }}" method="POST" class="auth-form">
          <div class="form-group mb-3">
            <label class="form-label fw-bold">Username</label>
            <input type="text" name="username" class="form-input" required placeholder="Enter your username" />
          </div>

          <p class="text-muted small border-bottom pb-1">Answer your security questions:</p>

          <div class="form-group mb-2">
            <label class="small form-label">1. What was the name of your first pet?</label>
            <input type="text" name="q1" class="form-input" required placeholder="Your answer" />
          </div>
          <div class="form-group mb-2">
            <label class="small form-label">2. What is your mother's maiden name?</label>
            <input type="text" name="q2" class="form-input" required placeholder="Your answer" />
          </div>
          <div class="form-group mb-3">
            <label class="small form-label">3. What was the name of your primary school?</label>
            <input type="text" name="q3" class="form-input" required placeholder="Your answer" />
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill">Verify Identity</button>
        </form>

      {% else %}
        <form action="{{ url_for('reset_password') }}" method="POST" id="registrationForm" class="auth-form">
          <input type="hidden" name="username" value="{{ username }}" />
          
          <div class="form-group mb-3">
            <label class="form-label fw-bold">New Password</label>
            <input type="password" id="password" name="new_password" class="form-input" required placeholder="••••••" />
            
            <p class="field-instruction-note">💡 Password must be at least 6 characters and contain a mix of uppercase, lowercase, and special symbols.</p>

            <div id="form-error-banner" class="error-banner" style="display: none;"></div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="••••••" />
          </div>

          <button type="submit" class="btn btn-success w-100 rounded-pill" style="margin-top: 1rem;">Update Password</button>
        </form>
      {% endif %}
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
